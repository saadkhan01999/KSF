# =============================================================================
# KSF — the site
# -----------------------------------------------------------------------------
# HTTP redirects to HTTPS. HTTPS proxies everything to the app container, which
# serves both the API and the built website.
#
# Nginx needs a certificate at the paths below before it will start. Begin
# with a self-signed pair, then replace it with a Let's Encrypt certificate
# issued through the /.well-known/acme-challenge/ location below —
# deploy/README.md, "HTTPS", has the exact commands.
#
#   openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#     -keyout deploy/nginx/certs/ksf.key -out deploy/nginx/certs/ksf.crt \
#     -subj "/CN=ksf.local"
# =============================================================================

# ------------------------------------------------------------ HTTP -> HTTPS --
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot's challenge has to stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Used by the container health check, which cannot present a certificate.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------ HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/ksf.crt;
    ssl_certificate_key /etc/nginx/certs/ksf.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    limit_conn ksf_conn 24;

    # The app sends its own security headers (CSP included). HSTS belongs to
    # whoever terminates TLS, which is this server.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------------------------------------------------------------- API --
    location /api/ {
        limit_req zone=ksf_api burst=40 nodelay;

        proxy_pass         http://app:8790;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;   # a large import takes a while
        proxy_read_timeout    120s;
        proxy_buffering       off;    # so progress is not held back in a buffer

        # Never cache an API response. Some of them are somebody's prescription.
        add_header Cache-Control "no-store" always;
    }

    # Sign-in and registration get a tighter limit than the rest of the API.
    # The application also throttles these per account; this stops the flood
    # before it costs Node anything at all.
    location ~ ^/api/v1/(auth/login|auth/two-factor|auth/refresh|auth/forgot-password|auth/reset-password|register/) {
        limit_req zone=ksf_auth burst=10 nodelay;

        proxy_pass         http://app:8790;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        add_header Cache-Control "no-store" always;
    }

    # The payment provider's webhook. It comes from the provider's network,
    # not from a browser, so the browser rate limit would be wrong for it.
    location = /api/v1/webhooks/payments/ {
        proxy_pass         http://app:8790;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ----------------------------------------------- the website and assets --
    location / {
        proxy_pass         http://app:8790;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /healthz {
        access_log off;
        return 200 "ok
";
    }

    # Nothing under these should ever be reachable over HTTP.
    location ~ /\.(?!well-known) { deny all; }
    location ~ \.(env|db|log)$ { deny all; }
}
