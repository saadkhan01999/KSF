# =============================================================================
# KSF Pharmacy Management System — production stack
# -----------------------------------------------------------------------------
#   app     the API, which also serves the built website
#   web     Nginx in front: HTTPS, HTTP/2, rate limits on sign-in
#   mongo   a single-node MongoDB replica set — only with --profile local-db.
#           With MongoDB Atlas (recommended) leave it off and point
#           MONGODB_URI at your cluster.
#
#   cp .env.example deploy/.env      # then fill it in; never commit it
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d
#   # with the bundled database instead of Atlas:
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml --profile local-db up -d
#
# No secret is written into any image: everything sensitive arrives from the
# env file at run time.
# =============================================================================

name: ksf-pharmacy

services:
  app:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8790"
      COOKIE_SECURE: "true"
      STATIC_DIR: frontend/dist
      # Nginx sits in front on the private Docker network: believe its X-Forwarded-For.
      TRUST_PROXY: uniquelocal
    volumes:
      - ksfdata:/app/.data
    networks: [ksf]
    expose:
      - "8790"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ksf.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot
    depends_on:
      - app
    networks: [ksf]
    security_opt:
      - no-new-privileges:true

  # A one-node replica set, so transactions work exactly as on Atlas. Not
  # published to the host: only the app can reach it.
  mongo:
    image: mongo:7.0
    profiles: ["local-db"]
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports it healthy.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [ksf]
    expose:
      - "27017"

volumes:
  ksfdata:
  mongodata:
  certbot-www:

networks:
  ksf:
    driver: bridge
